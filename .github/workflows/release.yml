name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      # Reference parity tests need Python 3.11+.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build archives and checksums
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Keep tag text safe in asset paths and linker arguments.
          [[ "$VERSION" =~ ^v[A-Za-z0-9._+-]*$ ]]
          mkdir -p dist
          stage=$(mktemp -d)
          trap 'rm -rf "$stage"' EXIT
          cp LICENSE README.md "$stage/"
          cp vendor/github.com/BurntSushi/toml/COPYING "$stage/LICENSE-toml"
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64; do
            export GOOS="${target%/*}" GOARCH="${target#*/}" CGO_ENABLED=0
            go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o "$stage/reclaimable" .
            COPYFILE_DISABLE=1 tar -czf "dist/reclaimable_${VERSION}_${GOOS}_${GOARCH}.tar.gz" -C "$stage" reclaimable LICENSE LICENSE-toml README.md
          done
          (cd dist && shasum -a 256 -- *.tar.gz > checksums.txt)
      - name: Attest archives
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - name: Create release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ github.ref_name }}
        shell: bash
        run: |
          gh release create "$VERSION" dist/*.tar.gz dist/checksums.txt \
            --verify-tag --title "$VERSION" --generate-notes
